<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>LLMOps Multi-Agent Platform</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<div class="container">

    <h1>🤖 LLMOps Multi-Agent Platform</h1>

    <textarea
        id="user_input"
        placeholder="Enter your prompt here..."></textarea>

    <br><br>

    <button onclick="sendPrompt()">Generate Response</button>

    <button onclick="copyResponse()">Copy Response</button>

    <button onclick="downloadResponse()">Download</button>

    <button onclick="clearOutput()">Clear</button>

    <hr>

    <h2>Validation</h2>
    <div class="box" id="validation"></div>

    <h2>Analysis</h2>
    <div class="box" id="analysis"></div>

    <h2>Refined Prompt</h2>
    <div class="box" id="refined_prompt"></div>

    <h2>Execution Time</h2>
    <div class="box" id="execution_time"></div>

    <h2>Final Response</h2>
    <div class="box" id="response"></div>

</div>

<script src="{{ url_for('static', filename='script.js') }}"></script>

</body>

</html>
